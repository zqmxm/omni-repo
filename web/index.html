<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>omni-repo · 万能软件仓库</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0b1120, #1e3a5f 60%, #312e81);
      color: #e8eef7;
    }
    .card {
      width: min(620px, 92vw); padding: 38px; text-align: center;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px; backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 14px; font-size: 27px; }
    p { margin: 9px 0; line-height: 1.75; color: #b9c8dd; }
    .tags { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .tag { padding: 6px 14px; border-radius: 999px; background: rgba(96,165,250,.18); font-size: 13px; }
    code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>omni-repo · 万能软件仓库</h1>
    <p>Python / Web / Node / Android APK / Windows exe / Go / Rust …… 什么都能往这里写。</p>
    <p>不绑定任何 AI：把目录拖进别的工具，读 <code>AGENTS.md</code> 就能接着干。</p>
    <div class="tags">
      <span class="tag">python/</span><span class="tag">web/</span><span class="tag">node/</span>
      <span class="tag">android/ · APK</span><span class="tag">desktop/ · exe</span>
      <span class="tag">scripts/</span><span class="tag">按需扩展</span>
    </div>
    <p style="margin-top:24px;font-size:13px">零依赖静态页，双击本文件即可打开</p>
  </div>
</body>
</html>
