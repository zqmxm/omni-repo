name: Auto Backup (通用自动备份)

# 任何 AI 新增软件后，只需在 build-manifest.json 里加一条配置，
# 本工作流会自动构建 exe/apk 并【新增一个独立 Release】。
# v2 永不覆盖：历史 Release / tag / 附件一律不删除、不覆盖。
# 也可在 Actions 页面手动触发并选择软件。

on:
  push:
    paths:
      - "build-manifest.json"
      - "desktop/**"
      - "android/**"
      - ".github/workflows/auto-backup.yml"
      - "scripts/build_all.py"
  workflow_dispatch:
    inputs:
      app:
        description: "要备份的软件名（留空 = 备份清单里全部）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: 读取构建清单
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析 build-manifest.json
        id: read
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('build-manifest.json', encoding='utf-8'))
          apps = list(manifest.get('apps', []))
          target = "${{ inputs.app }}".strip()
          if target:
              apps = [a for a in apps if a['name'] == target]
              if not apps:
                  raise SystemExit(f'清单中找不到: {target}')
          print('matrix=' + json.dumps({'include': apps}, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('matrix=' + json.dumps({'include': apps}, ensure_ascii=False) + '\n')
          PY

  build:
    name: 构建并备份 ${{ matrix.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '{"include":[]}' }}
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONLEGACYWINDOWSSTDIO: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JDK 17（安卓构建需要）
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖
        if: matrix.kind == 'python-exe'
        run: pip install -r "${{ matrix.dir }}/requirements.txt" "pyinstaller>=6,<7"

      - name: 构建 Windows exe
        if: matrix.kind == 'python-exe'
        run: python "${{ matrix.dir }}/build.py"

      - name: Go 环境（Go 桌面软件需要）
        if: matrix.kind == 'go-exe'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: 自检 Go 软件
        if: matrix.kind == 'go-exe'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: go test ./src -v

      - name: 构建 Go Windows exe（GUI + 可选 CLI）
        if: matrix.kind == 'go-exe'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          go build -ldflags="-H=windowsgui -s -w" -o "${{ matrix.artifact }}" ./src
          if [ -n "${{ matrix.cli_artifact }}" ]; then
            go build -ldflags="-s -w" -o "${{ matrix.cli_artifact }}" ./src
          fi

      - name: 构建 Android APK
        if: matrix.kind == 'android'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        if: matrix.kind == 'android'
        working-directory: ${{ matrix.dir }}
        run: |
          java -version
          gradle assembleDebug --no-daemon --stacktrace

      # 双保险：不论 Gradle 怎么命名输出，统一改成清单里写的软件本名
      - name: 统一 APK 产物名
        if: matrix.kind == 'android'
        shell: bash
        run: |
          TARGET="${{ matrix.artifact }}"
          find "${{ matrix.dir }}/app/build/outputs/apk/debug" -name '*.apk' | while read -r f; do
            if [ "$(basename "$f")" != "$TARGET" ]; then
              mv -- "$f" "$(dirname "$f")/$TARGET"
            fi
          done

      - name: 定位产物
        id: artifact
        shell: bash
        run: |
          PATTERN="${{ matrix.artifact }}"
          FILE=$(find "${{ matrix.dir }}" -type f -name "$(basename "$PATTERN")" | head -1)
          if [ -z "$FILE" ]; then
            echo "未找到产物：$PATTERN"; exit 1
          fi
          echo "找到产物：$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: 读取当前版本（不递增，避免与源码 appVersion 脱节）
        id: ver
        shell: bash
        run: |
          VF="${{ matrix.dir }}/VERSION"
          CUR=$(cat "$VF" 2>/dev/null || echo "0.0.0")
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          # v2 永不覆盖：tag 全局唯一（软件名 + 版本 + UTC 时间 + run_id），
          # 唯一性由时间戳与 run_id 保证，不需要靠递增 VERSION 制造差异。
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          echo "tag=${{ matrix.name }}-v${CUR}-${STAMP}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: 统一资产文件名（ASCII 名 + 中文 label）
        id: stable
        shell: bash
        run: |
          # GitHub 上传接口会剥离中文 name（变成 default.exe），所以文件名用
          # build-manifest.json 里的 ascii_name，中文软件本名放到 asset label。
          EXT="${{ matrix.artifact }}"; EXT="${EXT##*.}"
          BASE="${{ matrix.ascii_name }}"
          if [ -z "$BASE" ]; then BASE="app"; fi
          ASSET="${BASE}.${EXT}"
          cp "${{ steps.artifact.outputs.path }}" "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"
          echo "gui_label=${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          if [ -n "${{ matrix.cli_artifact }}" ]; then
            SRC=$(find "${{ matrix.dir }}" -type f -name "${{ matrix.cli_artifact }}" | head -1)
            if [ -n "$SRC" ]; then
              cp "$SRC" "${BASE}-CLI.${EXT}"
              echo "cli_path=${BASE}-CLI.${EXT}" >> "$GITHUB_OUTPUT"
              echo "cli_label=${{ matrix.name }} 命令行版" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 新增独立 Release（永不覆盖历史）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ matrix.name }} v${{ steps.ver.outputs.version }}
          # 只移动 Latest 徽章，不删除/不修改任何历史 Release
          make_latest: true
          body: |
            ## ${{ matrix.name }} v${{ steps.ver.outputs.version }}

            - 由 GitHub Actions 自动构建并备份
            - **v2 永不覆盖**：本次是一个全新的独立 Release，历史 Release / tag / 附件全部保留
            - 源码随本次 commit 一同保留在仓库
            - tag `${{ steps.ver.outputs.tag }}` 全局唯一，可用 `omni.py download --tag` 单独取回
          files: |
            ${{ steps.stable.outputs.path }}
            ${{ steps.stable.outputs.cli_path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 给附件挂中文显示名（label）
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.ver.outputs.tag }}';
            const gui = '${{ steps.stable.outputs.gui_label }}';
            const cli = '${{ steps.stable.outputs.cli_label }}';
            let rel;
            try {
              rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag,
              });
            } catch (e) { return; }
            for (const a of rel.data.assets) {
              const label = a.name.includes('-CLI') ? (cli || gui) : gui;
              if (!label) continue;
              await github.rest.repos.updateReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                asset_id: a.id, name: a.name, label,
              });
            }
