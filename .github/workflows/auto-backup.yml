name: Auto Backup (通用自动备份)

# 任何 AI 新增软件后，只需在 build-manifest.json 里加一条配置，
# 本工作流会自动构建 exe/apk 并更新固定 Release，只保留最新版。
# 也可在 Actions 页面手动触发并选择软件。

on:
  push:
    paths:
      - "build-manifest.json"
      - "desktop/**"
      - "android/**"
      - ".github/workflows/auto-backup.yml"
      - "scripts/build_all.py"
  workflow_dispatch:
    inputs:
      app:
        description: "要备份的软件名（留空 = 备份清单里全部）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: 读取构建清单
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析 build-manifest.json
        id: read
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('build-manifest.json', encoding='utf-8'))
          apps = manifest.get('apps', [])
          target = "${{ inputs.app }}".strip()
          if target:
              apps = [a for a in apps if a['name'] == target]
              if not apps:
                  raise SystemExit(f'清单中找不到: {target}')
          print('matrix=' + json.dumps({'include': apps}, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('matrix=' + json.dumps({'include': apps}, ensure_ascii=False) + '\n')
          PY

  build:
    name: 构建并备份 ${{ matrix.name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '{"include":[]}' }}
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONLEGACYWINDOWSSTDIO: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JDK 17（安卓构建需要）
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖
        if: matrix.kind == 'python-exe'
        run: pip install -r "${{ matrix.dir }}/requirements.txt" "pyinstaller>=6,<7"

      - name: 构建 Windows exe
        if: matrix.kind == 'python-exe'
        run: python "${{ matrix.dir }}/build.py"

      - name: Go 环境（Go 桌面软件需要）
        if: matrix.kind == 'go-exe'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: 自检 Go 软件
        if: matrix.kind == 'go-exe' && matrix.skip_test != true
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: go test ./src -v

      # 完整测试依赖 testdata/ 下的真实 .doc/.xls 二进制样本（不入库），
      # 这类软件在 CI 里只验证「能编译」，避免无样本导致误报失败。
      - name: 编译验证（跳过完整测试的软件）
        if: matrix.kind == 'go-exe' && matrix.skip_test == true
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: go build ./src

      - name: 构建 Go Windows exe
        if: matrix.kind == 'go-exe'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: go build -ldflags="-H=windowsgui -s -w" -o "${{ matrix.artifact }}" ./src

      - name: 构建 Android APK
        if: matrix.kind == 'android'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        if: matrix.kind == 'android'
        working-directory: ${{ matrix.dir }}
        run: |
          java -version
          gradle assembleDebug --no-daemon --stacktrace

      # 双保险：不论 Gradle 怎么命名输出，统一改成清单里写的软件本名
      - name: 统一 APK 产物名
        if: matrix.kind == 'android'
        shell: bash
        run: |
          TARGET="${{ matrix.artifact }}"
          find "${{ matrix.dir }}/app/build/outputs/apk/debug" -name '*.apk' | while read -r f; do
            if [ "$(basename "$f")" != "$TARGET" ]; then
              mv -- "$f" "$(dirname "$f")/$TARGET"
            fi
          done

      - name: 定位产物
        id: artifact
        shell: bash
        run: |
          PATTERN="${{ matrix.artifact }}"
          FILE=$(find "${{ matrix.dir }}" -type f -name "$(basename "$PATTERN")" | head -1)
          if [ -z "$FILE" ]; then
            echo "未找到产物：$PATTERN"; exit 1
          fi
          echo "找到产物：$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: 读取并递增版本
        id: ver
        shell: bash
        run: |
          VF="${{ matrix.dir }}/VERSION"
          CUR=$(cat "$VF" 2>/dev/null || echo "0.0.0")
          MAJOR=$(echo "$CUR" | cut -d. -f1)
          MINOR=$(echo "$CUR" | cut -d. -f2)
          PATCH=$(echo "$CUR" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH+1))"
          echo "$NEXT" > "$VF"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.name }}-latest" >> "$GITHUB_OUTPUT"

      - name: 统一为最新版资产文件名
        id: stable
        shell: bash
        run: |
          EXT="${{ matrix.artifact }}"
          EXT="${EXT##*.}"
          ASSET="${{ matrix.name }}.$EXT"
          cp "${{ steps.artifact.outputs.path }}" "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: 删除该软件的历史 Release（只留最新版）
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ matrix.name }}';
            const keep = name + '-latest';
            const rels = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const r of rels) {
              if (r.tag_name !== keep && r.tag_name.startsWith(name + '-v')) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: r.id,
                });
              }
            }

      - name: 清理当前 Release 的旧资产（避免中文名与旧名并存）
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ matrix.name }}-latest';
            let rel;
            try {
              rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag,
              });
            } catch (e) { return; }
            for (const a of rel.data.assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo, asset_id: a.id,
              });
            }

      - name: 更新固定 Release 并上传最新版产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ matrix.name }} v${{ steps.ver.outputs.version }}
          body: |
            ## ${{ matrix.name }} v${{ steps.ver.outputs.version }}

            - 由 GitHub Actions 自动构建并备份
            - 只保留最新版：每次更新覆盖同一个 Release，旧版本会删除
            - 源码随本次 commit 一同保留在仓库
          files: ${{ steps.stable.outputs.path }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交版本号更新（API 写入，避免 git 并行 push 竞争）
        uses: actions/github-script@v7
        with:
          script: |
            const path = '${{ matrix.dir }}/VERSION';
            const ver = '${{ steps.ver.outputs.version }}';
            let sha;
            try {
              const cur = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path,
              });
              sha = cur.data.sha;
            } catch (e) { sha = undefined; }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: `chore(${{ matrix.name }}): 版本更新至 v${ver}`,
              content: Buffer.from(ver + '\n').toString('base64'),
              sha,
            });
