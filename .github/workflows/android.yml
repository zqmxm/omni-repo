name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 镜像已预装 Android SDK（含 platform 34 / build-tools 34）
      # 且 licenses 已接受；AGP 会自动补齐缺失组件。
      # 早期版本额外调用 setup-android + sdkmanager 反而因权限冲突失败，故移除。
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null | head -10 || true

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 编译 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
