name: 构建透明橡皮擦 EXE

on:
  push:
    paths:
      - "desktop/透明橡皮擦/**"
      - ".github/workflows/透明橡皮擦.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONLEGACYWINDOWSSTDIO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r desktop/透明橡皮擦/requirements.txt
      - name: 单元测试
        run: python -m unittest discover -s desktop/透明橡皮擦/tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: 打包 exe
        run: python desktop/透明橡皮擦/build.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 透明橡皮擦-Windows-x64
          path: desktop/透明橡皮擦/dist/透明橡皮擦.exe
          if-no-files-found: error
